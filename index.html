<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2b705">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Raumfotos Team</title>
<style>
:root{--bg:#e9e8e4;--card:#fbfaf8;--tx:#1d2125;--mu:#666b70;--ac:#f2b705;--on:#1d2125;--bd:#d2d0ca;--dg:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#17191b;--card:#222527;--tx:#ecebe7;--mu:#9a9fa4;--bd:#34383b;--dg:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-top:env(safe-area-inset-top,0px)}
header{position:sticky;top:0;background:var(--ac);color:var(--on);padding:12px 16px;display:flex;align-items:center;gap:8px;z-index:5}
header h1{font-size:19px;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header button{background:transparent;color:var(--on);padding:6px 10px;font-size:22px}
main{padding:16px;max-width:720px;margin:auto;padding-bottom:110px}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:6px;padding:12px 16px;background:var(--ac);color:var(--on);cursor:pointer;display:inline-block;text-align:center}
button.s,.btn.s{background:var(--card);border:1px solid var(--bd);color:var(--tx)}
button.d{background:transparent;color:var(--dg);border:1px solid var(--dg)}
input[type=text],textarea{font:inherit;width:100%;padding:12px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx)}
:focus-visible{outline:3px solid var(--tx);outline-offset:2px}
.row{display:flex;gap:8px}
.f{background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--ac);border-radius:6px;padding:14px;margin:8px 0;display:flex;align-items:center;gap:10px;cursor:pointer}
.f b{flex:1}.mu{color:var(--mu);font-size:14px}
.crumb{margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:6px;margin:14px 0}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;cursor:pointer;display:block;background:var(--bd)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar div{max-width:720px;margin:auto;display:flex;gap:8px}
.bar .btn,.bar button{flex:1;padding:12px 6px}.bar .big{flex:2}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;flex-direction:column;gap:10px;padding:16px;z-index:10;overflow:auto;color:#eee}
#ov img{max-width:100%;max-height:50vh;object-fit:contain;margin:auto}
#ov label{font-size:14px;color:#bbb}
#ov .mu{color:#bbb}
.th{position:relative}.th .bd{position:absolute;right:4px;bottom:4px;background:var(--ac);color:var(--on);font-size:11px;font-weight:700;border-radius:4px;padding:1px 5px}
#cv{touch-action:none}
.th .st{position:absolute;left:4px;top:4px;font-size:12px;font-weight:700;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;color:#fff}
.st.o{background:#e53935}.st.b{background:#f57c00}.st.e{background:#2e7d32}.st.s{background:#8e0000}.st.l{background:#f9a825;color:#1d2125}
.th .ck{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff;background:rgba(0,0,0,.35);border-radius:4px;pointer-events:none}
.th.sel img{outline:4px solid var(--ac)}
.chip{display:inline-block;color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 8px;margin:2px 4px 0 0}
.chips{margin:0 0 10px}
input[type=range]{width:100%;accent-color:var(--ac)}
input[type=date],select{font:inherit;width:100%;padding:12px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx)}
.row select{flex:1}
#ov label input[type=checkbox]{width:auto;margin-right:8px}
#ov .cp{padding:7px 11px;font-size:14px;border-radius:6px}
#ov select.cp{font-weight:400}
</style></head>
<body>
<header id="hd"></header>
<main id="m"></main>
<div class="bar" id="fb"></div>
<div id="ov"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clean=s=>s.replace(/[\\\/:*?"<>|#%]/g,'_').trim().slice(0,60);
const L=['Baustelle','Geschoss','Unterordner (frei benennbar)','Weiterer Unterordner (frei benennbar)'];
let db=null,items=[],P=[];

/* ---------- Speicher ---------- */
const openDb=()=>new Promise((res,rej)=>{const r=indexedDB.open('raumfotos2',2);
 r.onupgradeneeded=e=>{const d=r.result,t=r.transaction;
  if(!d.objectStoreNames.contains('items'))d.createObjectStore('items',{keyPath:'id'});
  if(!d.objectStoreNames.contains('img'))d.createObjectStore('img',{keyPath:'id'});
  if(!d.objectStoreNames.contains('th'))d.createObjectStore('th',{keyPath:'id'});
  if(e.oldVersion===1){const im=t.objectStore('img');
   t.objectStore('items').openCursor().onsuccess=ev=>{const c=ev.target.result;if(!c)return;const x=c.value;
    if(x.type==='p'&&x.d){im.put({id:x.id,d:x.d,d0:x.d0||null,o:x.o||null});const y={...x,os:x.o?x.o.size:0};delete y.d;delete y.d0;delete y.o;c.update(y)}
    c.continue()}}};
 r.onblocked=()=>alert('Bitte andere Fenster/Tabs der App schließen und neu laden.');
 r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=(m,f)=>new Promise((res,rej)=>{if(!db)return res();const t=db.transaction('items',m);const q=f(t.objectStore('items'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)});
const metaOf=x=>{const m={...x};delete m.d;delete m.d0;delete m.o;delete m._h;delete m.th;return m};
const put=(x,keep)=>{if(!keep)x.mt=Date.now();
 if(x.type!=='p'||!db)return tx('readwrite',s=>s.put(x));
 if(x._h)x.os=x.o?x.o.size:0;
 if(x.th)x.ht=true;
 const m=metaOf(x),wi=x._h,th=x.th;
 return new Promise((res,rej)=>{const t=db.transaction(['items','img','th'],'readwrite');
  t.objectStore('items').put(m);
  if(wi)t.objectStore('img').put({id:x.id,d:x.d,d0:x.d0||null,o:x.o||null});
  if(th)t.objectStore('th').put({id:x.id,th});
  t.oncomplete=()=>{if(wi)free(x);delete x.th;res()};t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})};
const imgGet=id=>new Promise(res=>{if(!db)return res(null);const r=db.transaction('img','readonly').objectStore('img').get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)});
const thPut=(id,th)=>new Promise(res=>{if(!db)return res();const t=db.transaction('th','readwrite');t.objectStore('th').put({id,th});t.oncomplete=()=>res();t.onerror=()=>res()});
/* Foto-Daten (großes Bild, Original) nur bei Bedarf in den Arbeitsspeicher holen */
async function full(p){if(!p||p.type!=='p'||p._h)return p;const r=await imgGet(p.id);
 if(r){p.d=r.d;p.d0=r.d0||null;p.o=r.o||null;p._h=true}else if(p.d)p._h=true;return p}
const free=p=>{if(db&&p._h){delete p.d;delete p.d0;delete p.o;p._h=false}};
const loadImg=u=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=u});
const thOf=s=>{const w=s.naturalWidth||s.width,h=s.naturalHeight||s.height,k=Math.min(1,320/Math.max(w,h)),c=document.createElement('canvas');
 c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));c.getContext('2d').drawImage(s,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.72)};
const thFromUrl=async u=>thOf(await loadImg(u));
function fillTh(root){if(!root)return;const els=[...root.querySelectorAll('img[data-th]:not([src])')];if(!els.length)return;
 if(!db){els.forEach(e=>{const p=items.find(x=>x.id===e.dataset.th);if(p&&p.th)e.src=p.th});return}
 const s=db.transaction('th','readonly').objectStore('th');
 els.forEach(e=>{const r=s.get(e.dataset.th);r.onsuccess=()=>{if(r.result&&e.isConnected)e.src=r.result.th}})}
async function mkThumbs(){const todo=items.filter(x=>x.type==='p'&&!x.ht);if(!todo.length||!db)return;let n=0;
 for(const p of todo){try{const r=await imgGet(p.id);if(r&&r.d){await thPut(p.id,await thFromUrl(r.d));p.ht=true;await tx('readwrite',s=>s.put(metaOf(p)))}}catch(_){}
  if(++n%20===0)fillTh(document)}
 fillTh(document)}
const prog=t=>{const e=$('#mg');if(e)e.textContent=t};
const del=id=>new Promise((res,rej)=>{if(!db)return res();const t=db.transaction(['items','img','th'],'readwrite');
 t.objectStore('items').delete(id);t.objectStore('img').delete(id);t.objectStore('th').delete(id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- Ordner-Logik ---------- */
const pf=(a,b)=>a.length<=b.length&&a.every((x,i)=>x===b[i]);
const sub=a=>items.filter(x=>pf(a,x.path));
function kids(a){const m=new Map();for(const x of sub(a))if(x.path.length>a.length){const n=x.path[a.length],e=m.get(n)||[0,0];if(x.type==='p'){e[0]++;if(isOpen(x))e[1]++}m.set(n,e)}return[...m].map(([n,e])=>[n,e[0],e[1]]).sort((x,y)=>x[0].localeCompare(y[0],'de'))}
const photosIn=a=>items.filter(x=>x.type==='p'&&pf(a,x.path));
const photosAt=a=>items.filter(x=>x.type==='p'&&x.path.length===a.length&&pf(a,x.path));
const plansAt=a=>items.filter(x=>x.type==='plan'&&x.path.length===a.length&&pf(a,x.path));
const plansFor=p=>items.filter(x=>x.type==='plan'&&pf(x.path,p.path));
const KAT=['Mangel','Dokumentation','Bestandsaufnahme','Fußbodenheizung','Abklärung erforderlich'];
const ST3=['offen','in Bearbeitung','erledigt'],ST5=[...ST3,'Schwerer Mangel nicht behebbar','Leichter Mangel nicht behebbar'];
const stList=k=>k==='Mangel'?ST5:(KCOL[k]?[]:ST3);
const isOpen=p=>!!p.st&&p.st!=='erledigt'&&!KCOL[p.kat];
const stCls=s=>({'offen':'o','in Bearbeitung':'b','erledigt':'e','Schwerer Mangel nicht behebbar':'s','Leichter Mangel nicht behebbar':'l'}[s]||'o');
const stIco=s=>({o:'!',b:'⋯',e:'✓',s:'‼',l:'▲'}[stCls(s)]);
const STC={'offen':['!','#e53935'],'in Bearbeitung':['⋯','#f57c00'],'erledigt':['✓','#2e7d32'],'Schwerer Mangel nicht behebbar':['‼','#8e0000'],'Leichter Mangel nicht behebbar':['▲','#f9a825']};
const KC={'Mangel':'!','Abklärung erforderlich':'?','Dokumentation':'D','Bestandsaufnahme':'B','Fußbodenheizung':'F'};
const KCOL={'Dokumentation':'#1e88e5','Bestandsaufnahme':'#8e24aa','Fußbodenheizung':'#00897b'};
function badge(p){
 if(p.kat&&KCOL[p.kat])return{g:KC[p.kat],bg:KCOL[p.kat],fg:'#fff',t:p.kat};
 if(p.st){const[g0,c]=STC[p.st]||['!','#e53935'];return{g:p.kat==='Abklärung erforderlich'?'?':g0,bg:c,fg:c==='#f9a825'?'#1d2125':'#fff',t:(p.kat?p.kat+' · ':'')+p.st}}
 if(p.kat)return{g:KC[p.kat]||'•',bg:'#607d8b',fg:'#fff',t:p.kat};
 return null}
const pinKey=p=>p.pin?p.pin.pl+'@'+(+p.pin.x).toFixed(4)+','+(+p.pin.y).toFixed(4):'';
const sev=p=>({'Schwerer Mangel nicht behebbar':5,'offen':4,'in Bearbeitung':3,'Leichter Mangel nicht behebbar':2,'erledigt':1}[p.st]||0);
const topPhoto=l=>l.slice().sort((a,b)=>sev(b)-sev(a))[0];
const CHIP=[['Mangel','!','#e53935'],['Abklärung erforderlich','?','#f57c00'],['Dokumentation','D','#1e88e5'],['Bestandsaufnahme','B','#8e24aa'],['Fußbodenheizung','F','#00897b'],['','–','#78909c']];
function chips(a,full,act){const ps=photosIn(a);
 return CHIP.map(([k,g,c])=>[k,g,c,ps.filter(q=>(q.kat||'')===k).length]).filter(x=>x[3])
  .map(([k,g,c,n])=>`<span class="chip${full?' chipf':''}" ${full?`data-k="${esc(k)}" role="button" `:''}style="background:${c};${full?'cursor:pointer;':''}${act!=null&&act===k?'outline:3px solid var(--ac);outline-offset:1px;':''}" title="${esc(k||'Ohne Kategorie')}">${g} ${full?esc(k||'Ohne Kategorie')+' ':''}${n}</span>`).join('')}
const addrOf=n=>(items.find(x=>x.type==='f'&&x.path.length===1&&x.path[0]===n)||{}).addr||'';
const stamp=t=>{const d=new Date(t),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`};

/* ---------- Foto -> JPEG ---------- */
function proc(file,mx=1600){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();
 i.onload=()=>{const k=Math.min(1,mx/Math.max(i.width,i.height)),c=document.createElement('canvas');
  c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);
  URL.revokeObjectURL(u);res({d:c.toDataURL('image/jpeg',.82),w:c.width,h:c.height,th:thOf(c)})};
 i.onerror=rej;i.src=u})}

/* ---------- PDF ---------- */
const enc=s=>{const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a[i]=c<256?c:63}return a};
const pe=s=>s.replace(/[\\()]/g,'\\$&').replace(/[\r\n]+/g,' ');

const UL={mm:1,cm:10,m:1000},UA={'mm²':1,'cm²':100,'m²':1e6};
const fmtN=v=>String(+(+v).toFixed(2)).replace('.',',');
const numIn=t=>{const v=parseFloat(String(t).replace(',','.'));return isFinite(v)?v:null};
const fsOf=(s,k)=>s.f||k*6,lwOf=(s,k)=>s.w||k;
function shapeTxt(s){if(s.t==='angle')return fmtN(s.val)+'°';if((s.t==='dim'||s.t==='area')&&s.val!=null)return fmtN(s.val)+' '+s.unit;return s.txt||''}
function angGeo(P,k,lw){const[A,V,B]=P,a1=Math.atan2(A[1]-V[1],A[0]-V[0]),a2=Math.atan2(B[1]-V[1],B[0]-V[0]);let d=a2-a1;
 while(d>Math.PI)d-=2*Math.PI;while(d<=-Math.PI)d+=2*Math.PI;
 const r=Math.max(lw*4,Math.min(Math.hypot(A[0]-V[0],A[1]-V[1]),Math.hypot(B[0]-V[0],B[1]-V[1]))*.4);
 return{a1,d,V,r,deg:Math.abs(d)*180/Math.PI}}
function labelC(s,k){const fs=fsOf(s,k),lw=lwOf(s,k);
 if(s.t==='dim'){const a=Math.atan2(s.y2-s.y1,s.x2-s.x1),o=fs*.85+lw;return[(s.x1+s.x2)/2+Math.sin(a)*o,(s.y1+s.y2)/2-Math.cos(a)*o]}
 if(s.t==='area'){const n=s.pts.length;return[s.pts.reduce((a,q)=>a+q[0],0)/n,s.pts.reduce((a,q)=>a+q[1],0)/n]}
 if(s.t==='angle'){const G=angGeo(s.pts,k,lw),am=G.a1+G.d/2,rr=G.r+fs*.9;return[G.V[0]+rr*Math.cos(am),G.V[1]+rr*Math.sin(am)]}
 return null}
function lbl(g,x,y,t,c,fs){g.font=`bold ${fs}px system-ui,sans-serif`;g.textAlign='center';g.textBaseline='middle';
 g.lineWidth=fs/5;g.strokeStyle='#fff';g.strokeText(t,x,y);g.fillStyle=c;g.fillText(t,x,y)}
function drawShape(g,s,k){
 const lw=lwOf(s,k),fs=fsOf(s,k);
 g.strokeStyle=g.fillStyle=s.c;g.lineWidth=lw;g.lineCap='round';g.lineJoin='round';
 const{x1,y1,x2,y2}=s,a=Math.atan2(y2-y1,x2-x1);
 if(s.t==='rect')g.strokeRect(Math.min(x1,x2),Math.min(y1,y2),Math.abs(x2-x1),Math.abs(y2-y1));
 else if(s.t==='ellipse'){g.beginPath();g.ellipse((x1+x2)/2,(y1+y2)/2,Math.abs(x2-x1)/2||1,Math.abs(y2-y1)/2||1,0,0,7);g.stroke()}
 else if(s.t==='pen'){g.beginPath();s.pts.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.stroke()}
 else if(s.t==='arrow'){const h=lw*5;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();
  g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-h*Math.cos(a-.45),y2-h*Math.sin(a-.45));g.lineTo(x2-h*Math.cos(a+.45),y2-h*Math.sin(a+.45));g.closePath();g.fill()}
 else if(s.t==='dim'){const n=lw*3,L=labelC(s,k);g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);
  for(const[px,py]of[[x1,y1],[x2,y2]]){g.moveTo(px-n*Math.sin(a),py+n*Math.cos(a));g.lineTo(px+n*Math.sin(a),py-n*Math.cos(a))}
  g.stroke();lbl(g,L[0],L[1],shapeTxt(s),s.c,fs)}
 else if(s.t==='area'){const L=labelC(s,k);g.beginPath();s.pts.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.closePath();
  g.save();g.globalAlpha=.2;g.fill();g.restore();g.stroke();lbl(g,L[0],L[1],shapeTxt(s),s.c,fs)}
 else if(s.t==='angle'){const[A,V,B]=s.pts,G=angGeo(s.pts,k,lw),L=labelC(s,k);
  g.beginPath();g.moveTo(A[0],A[1]);g.lineTo(V[0],V[1]);g.lineTo(B[0],B[1]);g.stroke();
  g.beginPath();g.arc(V[0],V[1],G.r,G.a1,G.a1+G.d,G.d<0);g.stroke();lbl(g,L[0],L[1],shapeTxt(s),s.c,fs)}

function dseg(x,y,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((x-ax)*dx+(y-ay)*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(x-(ax+t*dx),y-(ay+t*dy))}
function inPoly(P,x,y){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){if((P[i][1]>y)!==(P[j][1]>y)&&x<(P[j][0]-P[i][0])*(y-P[i][1])/(P[j][1]-P[i][1])+P[i][0])c=!c}return c}
function hitShape(s,x,y,tol,k){
 const T=tol+lwOf(s,k)/2,P=s.pts;let seg=[];
 if(s.t==='text'){const hw=(s.txt||'').length*fsOf(s,k)*.3,hh=fsOf(s,k)*.6;return Math.abs(x-s.x)<=hw+tol&&Math.abs(y-s.y)<=hh+tol}
 if(s.t==='rect'){const a=Math.min(s.x1,s.x2),b=Math.min(s.y1,s.y2),c=Math.max(s.x1,s.x2),d=Math.max(s.y1,s.y2);seg=[[a,b,c,b],[c,b,c,d],[c,d,a,d],[a,d,a,b]]}
 else if(s.t==='ellipse'){const cx=(s.x1+s.x2)/2,cy=(s.y1+s.y2)/2,rx=Math.abs(s.x2-s.x1)/2,ry=Math.abs(s.y2-s.y1)/2;
  for(let i=0;i<48;i++){const a=i/48*2*Math.PI,b=(i+1)/48*2*Math.PI;seg.push([cx+rx*Math.cos(a),cy+ry*Math.sin(a),cx+rx*Math.cos(b),cy+ry*Math.sin(b)])}}
 else if(s.t==='pen'||s.t==='area'){for(let i=0;i<P.length-1;i++)seg.push([P[i][0],P[i][1],P[i+1][0],P[i+1][1]]);if(s.t==='area')seg.push([P[P.length-1][0],P[P.length-1][1],P[0][0],P[0][1]])}
 else if(s.t==='angle')seg=[[P[0][0],P[0][1],P[1][0],P[1][1]],[P[1][0],P[1][1],P[2][0],P[2][1]]];
 else seg=[[s.x1,s.y1,s.x2,s.y2]];
 if(seg.some(q=>dseg(x,y,q[0],q[1],q[2],q[3])<=T))return true;
 if(s.t==='area'&&inPoly(P,x,y))return true;
 const L=labelC(s,k);if(L){const t=shapeTxt(s),hw=t.length*fsOf(s,k)*.3,hh=fsOf(s,k)*.6;if(Math.abs(x-L[0])<=hw+tol&&Math.abs(y-L[1])<=hh+tol)return true}
 return false}
function bboxShape(s,k){let pts=[];
 if(s.t==='text'){const hw=(s.txt||'').length*fsOf(s,k)*.3,hh=fsOf(s,k)*.6;pts=[[s.x-hw,s.y-hh],[s.x+hw,s.y+hh]]}
 else pts=s.pts?s.pts.slice():[[s.x1,s.y1],[s.x2,s.y2]];
 const L=labelC(s,k);if(L){const t=shapeTxt(s),hw=t.length*fsOf(s,k)*.3,hh=fsOf(s,k)*.6;pts.push([L[0]-hw,L[1]-hh],[L[0]+hw,L[1]+hh])}

function moveShape(s,dx,dy){if(s.pts)s.pts=s.pts.map(q=>[q[0]+dx,q[1]+dy]);else if(s.t==='text'){s.x+=dx;s.y+=dy}else{s.x1+=dx;s.x2+=dx;s.y1+=dy;s.y2+=dy}}
const polyA=P=>{let a=0;for(let i=0;i<P.length;i++){const j=(i+1)%P.length;a+=P[i][0]*P[j][1]-P[j][0]*P[i][1]}return Math.abs(a)/2};

   <div class="row"><button class="s" id="zi">＋</button><button class="s" id="zo">－</button><button class="s" id="zr">Ganzer Plan</button></div><button class="s" id="vc2">Zurück</button>`);
   const z=zoomBox($('#zb'),$('#zn'),null);$('#zi').onclick=z.in;$('#zo').onclick=z.out;$('#zr').onclick=z.reset;$('#vc2').onclick=()=>versionsView(pl)}
  else if(b.dataset.a==='r'){
   if(!confirm(`Plan auf den Stand vom ${dt(v.v)} zurücksetzen?\n\nDer aktuelle Plan wird als Version aufgehoben. Pins, die schon beim alten Plan gesetzt waren, springen auf ihre damalige Stelle zurück. Fotos, die danach gepinnt wurden, bleiben an ihrer jetzigen Stelle.`))return;
   const pins=photosIn(pl.path).filter(q=>q.pin&&q.pin.pl===pl.name),cur=makeVer(pl,pins);
   Object.assign(pl,{d:v.d,w:v.w,h:v.h,fmt:v.fmt||'',pw:v.pw||null,ph:v.ph||null,v:v.v||Date.now(),sc:v.sc||null,mw:v.mw||null,cal:v.cal||'',ms:JSON.parse(JSON.stringify(v.ms||[])),src:v.src||null,up:false,sup:false});
   pl.vers=(pl.vers||[]).filter(q=>q!==v);pl.vers.push(cur);(pl.vdel=pl.vdel||[]).push(v.id);dropVerCloud(pl,v);
   for(const o of v.pn||[]){const q=items.find(i=>i.id===o.id);if(q&&q.pin&&q.pin.pl===pl.name){q.pin={...q.pin,x:o.x,y:o.y};await put(q)}}
   recalcPlan(pl);await put(pl);view();planView(pl)}
  else if(b.dataset.a==='d'){if(!confirm('Diese Version endgültig löschen?'))return;
   pl.vers=(pl.vers||[]).filter(q=>q!==v);(pl.vdel=pl.vdel||[]).push(v.id);dropVerCloud(pl,v);await put(pl);versionsView(pl)}}))}
function planView(pl){
 const ph=photosIn(pl.path).filter(p=>p.pin&&p.pin.pl===pl.name).sort((a,b)=>a.t-b.t),gr=new Map();
 ph.forEach(p=>{const k=pinKey(p);(gr.get(k)||gr.set(k,[]).get(k)).push(p)});
 const gl=[...gr.values()],info=`${gl.length} Pin${gl.length==1?'':'s'} · ${ph.length} Foto${ph.length==1?'':'s'}${pl.fmt?' · '+pl.fmt:''}${pl.v?' · Stand '+new Date(pl.v).toLocaleDateString('de-AT'):''}${pl.sup||pl.src?' · Original-PDF gesichert':''} · ${scInfo(pl)}`;
 showOv(`<h2 style="margin:0">${esc(planLabel(pl))}</h2><div class="mu" id="pmsg">${info}</div>
 <div id="zb" style="${ZB}"><div id="zn" style="position:relative;transform-origin:0 0"><img id="plimg" src="${pl.d}" alt="" style="max-height:62vh;max-width:100%;display:block;margin:0">${(pl.ms||[]).length?'<canvas id="mcv" style="position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none"></canvas>':''}${gl.map((g,i)=>{const b=badge(topPhoto(g))||{g:'•',bg:'#1e88e5',fg:'#fff'};return `<button class="pn mk" data-i="${i}" style="position:absolute;left:${g[0].pin.x*100}%;top:${g[0].pin.y*100}%;transform:translate(-50%,-50%);width:30px;height:30px;padding:0;border-radius:50%;background:${b.bg};color:${b.fg};border:2px solid #fff;font-size:15px;line-height:1;touch-action:none">${b.g}<i style="position:absolute;right:-7px;bottom:-7px;background:#fff;color:#000;border-radius:8px;font-size:10px;padding:0 4px;font-style:normal;line-height:14px">${i+1}${g.length>1?'×'+g.length:''}</i></button>`}).join('')}</div></div>
 <div class="row"><button class="s" id="zi">＋</button><button class="s" id="zo">－</button><button class="s" id="zr">Ganzer Plan</button><button class="s" id="pm">✥ Pins verschieben</button></div>
 <div class="row"><button id="ms">📏 Messen</button><button class="s" id="sc">Maßstab …</button><button class="s" id="vs">🕘 Versionen${(pl.vers||[]).length?' ('+pl.vers.length+')':''}</button></div>
 <label class="btn s">↻ Plan ersetzen (PDF oder Bild)<input type="file" id="prp" accept="application/pdf,image/*" hidden></label>
 <div class="row"><button class="s" id="pc">Schließen</button><button class="d" id="pd" style="background:#fff">Plan löschen</button></div>`);
 if($('#mcv')){const c=$('#mcv');c.width=pl.w;c.height=pl.h;const g=c.getContext('2d'),k=Math.max(4,Math.round(pl.w/190));pl.ms.forEach(x=>drawShape(g,scaleSh(x,pl.w),k))}
 $('#ms').onclick=()=>editView(null,{plan:pl});$('#vs').onclick=()=>versionsView(pl);
 $('#sc').onclick=guard(async()=>{
  if(!pl.pw)return alert('Dieser Plan hat keine bekannte Papiergröße (Bild statt PDF). Bitte im Messmodus mit „📏 Eichen“ an einem bekannten Maß eichen.');
  const t=prompt(`Maßstab 1: ?  (Papier ${pl.fmt||Math.round(pl.pw)+' mm breit'}). Gilt nur, wenn das PDF in Originalgröße gespeichert ist.`,pl.sc||50);if(t===null)return;
  const n=numIn(t);if(!n||n<=0)return alert('Bitte eine Zahl eingeben, z. B. 50.');
  pl.sc=n;pl.mw=pl.pw*n;pl.cal='scale';recalcPlan(pl);await put(pl);planView(pl)});
 const z=zoomBox($('#zb'),$('#zn'),null);$('#zi').onclick=z.in;$('#zo').onclick=z.out;$('#zr').onclick=z.reset;
 let mv=false,drag=null;
 $('#pm').onclick=()=>{mv=!mv;$('#pm').textContent=mv?'✥ Verschieben: an':'✥ Pins verschieben';
  $('#pmsg').textContent=mv?'Ziehe einen Pin an die neue Stelle. Bei Pins mit mehreren Fotos wandern alle Fotos mit.':info;
  document.querySelectorAll('.pn').forEach(b=>{b.style.outline=mv?'3px dashed #fff':'none'})};
 document.querySelectorAll('.pn').forEach(b=>{
  b.onclick=()=>{if(mv)return;const g=gl[+b.dataset.i];g.length===1?photoView(g[0]):groupView(g,pl)};
  b.onpointerdown=e=>{if(!mv)return;e.stopPropagation();e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}drag={b,i:+b.dataset.i,pos:null}};
  b.onpointermove=e=>{if(!drag||drag.b!==b)return;const r=$('#plimg').getBoundingClientRect();
   const x=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),y=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));
   b.style.left=x*100+'%';b.style.top=y*100+'%';drag.pos={x:+x.toFixed(4),y:+y.toFixed(4)}};
  b.onpointerup=guard(async e=>{if(!drag||drag.b!==b)return;const d=drag;drag=null;if(d.pos)await applyPin(gl[d.i],pl,d.pos)})});
 $('#prp').onchange=guard(async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const x=await readPlan(f);
  const pins=photosIn(pl.path).filter(q=>q.pin&&q.pin.pl===pl.name);let T=null;const snap=makeVer(pl,pins);
  if((pins.length||(pl.ms||[]).length)&&confirm(`Pins (${pins.length}) und Messungen am neuen Plan ausrichten?\n\nOK = du tippst einen markanten Punkt im alten und im neuen Plan an, die App rechnet alles um.\nAbbrechen = alles bleibt an derselben Stelle im Blatt.`)){T=await alignFlow(pl,x,pins);if(!T)return planView(pl);await applyAlign(pl,x,pins,T)}
  if(!T&&Math.abs((x.w/x.h)/(pl.w/pl.h)-1)>.02&&!confirm('Das neue Blatt hat ein anderes Seitenverhältnis. Die Pins können dann an der falschen Stelle sitzen. Trotzdem ersetzen?'))return;
  (pl.vers=pl.vers||[]).push(snap);
  Object.assign(pl,{d:x.d,w:x.w,h:x.h,fmt:x.fmt||'',src:x.src||null,pw:x.pw||null,ph:x.ph||null,v:Date.now(),up:false,sup:false});
  if(!T&&pl.cal==='scale'&&pl.sc&&pl.pw)pl.mw=pl.pw*pl.sc;recalcPlan(pl);await put(pl);view();planView(pl)});
 $('#pc').onclick=hideOv;
 $('#pd').onclick=guard(async()=>{const c=pl.up&&!!tok();if(!confirm(`Plan „${planLabel(pl)}“ löschen?${c?' Auch in OneDrive – für alle Personen.':''}`))return;
  if(c){try{const R=await getRoot();await gf(loc(R,[...pl.path,pl.name]),{method:'DELETE'})}catch(e){if(!/404/.test(e.message))throw e}try{await gf(loc(R,[...pl.path,pmName(pl)]),{method:'DELETE'})}catch(e){}}
  await addTomb({k:'plan',name:pl.name,fp:pl.path});items=items.filter(x=>x!==pl);await del(pl.id);view()});
}
async function applyPin(list,pl,pos){
 for(const q of list){if(pos)q.pin={pl:pl.name,x:pos.x,y:pos.y};else delete q.pin;await put(q)}}
function pinView(list,pl){
 const p0=list[0],ps=plansFor(p0),bd=badge(topPhoto(list))||{g:'•',bg:'#e53935',fg:'#fff'};
 const back=()=>{if(list.length===1)photoView(p0);else view()};
 if(!pl){if(ps.length>1){showOv(`<h2 style="margin:0">Welcher Plan?</h2>${ps.map(x=>`<button class="s pp" data-id="${x.id}">${esc(planLabel(x))}</button>`).join('')}<button class="s" id="pc">Abbrechen</button>`);
   $('#pc').onclick=back;document.querySelectorAll('.pp').forEach(b=>b.onclick=()=>pinView(list,ps.find(x=>x.id===b.dataset.id)));return}
  pl=ps[0]}
 const ex=new Map();photosIn(pl.path).filter(q=>q.pin&&q.pin.pl===pl.name&&!list.includes(q)).forEach(q=>{const k=pinKey(q);(ex.get(k)||ex.set(k,[]).get(k)).push(q)});
 const exl=[...ex.values()];
 let pos=p0.pin&&p0.pin.pl===pl.name&&list.every(q=>pinKey(q)===pinKey(p0))?{x:p0.pin.x,y:p0.pin.y}:null;
 const dot=()=>pos?`left:${pos.x*100}%;top:${pos.y*100}%;display:block`:'display:none';
 showOv(`<div class="mu">${pos?'Der Pin sitzt hier. Tippe auf eine andere Stelle, um ihn zu verschieben.':'Tippe auf die Stelle im Plan'}${list.length>1?' (gilt für alle '+list.length+' Fotos)':''}. Tippst du auf einen vorhandenen Pin, bekommt das Foto genau diesen Pin. Zoomen: zwei Finger oder ＋ / －, verschieben: Plan ziehen.</div>
 <div id="zb" style="${ZB}"><div id="zn" style="position:relative;transform-origin:0 0"><img id="pi" src="${pl.d}" alt="" style="max-height:62vh;max-width:100%;display:block;margin:0">${exl.map(g=>`<span class="mk" style="position:absolute;left:${g[0].pin.x*100}%;top:${g[0].pin.y*100}%;transform:translate(-50%,-50%);width:20px;height:20px;border-radius:50%;background:${(badge(topPhoto(g))||{bg:'#1e88e5'}).bg};border:2px solid #fff;opacity:.8;pointer-events:none"></span>`).join('')}<span id="dt" class="mk" style="position:absolute;width:28px;height:28px;border-radius:50%;background:${bd.bg};color:${bd.fg};border:2px solid #fff;transform:translate(-50%,-50%);pointer-events:none;line-height:24px;text-align:center;font-weight:700;${dot()}">${bd.g}</span></div></div>
 <div class="row"><button class="s" id="zi">＋</button><button class="s" id="zo">－</button><button class="s" id="zr">Ganzer Plan</button></div>
 <div class="row"><button id="po">Speichern</button><button class="s" id="pr">Pin entfernen</button><button class="s" id="pc">Abbrechen</button></div>`);
 const z=zoomBox($('#zb'),$('#zn'),(cx,cy)=>{const r=$('#pi').getBoundingClientRect();if(cx<r.left||cx>r.right||cy<r.top||cy>r.bottom)return;
  let x=(cx-r.left)/r.width,y=(cy-r.top)/r.height;
  const near=exl.find(g=>Math.hypot((g[0].pin.x-x)*r.width,(g[0].pin.y-y)*r.height)<22);
  if(near){x=near[0].pin.x;y=near[0].pin.y}
  pos={x:+x.toFixed(4),y:+y.toFixed(4)};
  const d=$('#dt');d.style.display='block';d.style.left=pos.x*100+'%';d.style.top=pos.y*100+'%'});
 $('#zi').onclick=z.in;$('#zo').onclick=z.out;$('#zr').onclick=z.reset;
 $('#po').onclick=guard(async()=>{await applyPin(list,pl,pos);back()});
 $('#pr').onclick=guard(async()=>{await applyPin(list,pl,null);back()});
 $('#pc').onclick=back;
}
async function applyBatch(list,k,s){
 for(const p of list){const nk=k==='__keep'?(p.kat||''):k,l=stList(nk);
  p.kat=nk;if(s!=='__keep'&&(s===''||l.includes(s)))p.st=s;if(p.st&&!l.includes(p.st))p.st='';
  await put(p)}}
function batchView(list){
 const pl=plansFor(list[0]);
 showOv(`<h2 style="margin:0">${list.length} Foto${list.length==1?'':'s'} bearbeiten</h2><div class="mu" id="mg">Die Auswahl gilt für alle ausgewählten Fotos. „Nicht ändern“ lässt den bisherigen Wert.</div>
 <label>Kategorie</label><select id="bk1"><option value="__keep">Nicht ändern</option><option value="">Keine Kategorie</option>${KAT.map(k=>`<option>${esc(k)}</option>`).join('')}</select>
 <label>Status</label><select id="bk2"></select>
 ${pl.length?'<button class="s" id="bk3">📍 Gemeinsamen Pin auf dem Plan setzen</button>':''}
 <button id="bk4">Übernehmen</button><button class="s" id="bk5">Abbrechen</button>`);
 const fill=()=>{const k=$('#bk1').value,l=k==='__keep'?ST5:stList(k);
  $('#bk2').innerHTML='<option value="__keep">Nicht ändern</option>'+(l.length?'<option value="">Kein Status</option>':'')+l.map(x=>`<option>${esc(x)}</option>`).join('');
  $('#bk2').style.display=(k!=='__keep'&&!l.length)?'none':''};
 $('#bk1').onchange=fill;fill();
 if($('#bk3'))$('#bk3').onclick=()=>pinView(list);
 $('#bk4').onclick=guard(async()=>{await applyBatch(list,$('#bk1').value,$('#bk2').value);sel=null;view()});
 $('#bk5').onclick=hideOv;
}
async function photoView(p){
 if(VIEW&&VIEW!==p)free(VIEW);await full(p);VIEW=p;
 const sr=series(p),pl=plansFor(p);
 showOv(`<img src="${p.d}" alt="" style="max-height:34vh"><div class="mu" style="font-size:13px">${p.path.map(esc).join(' › ')} · ${new Date(p.t).toLocaleString('de-AT')}${p.by?' · '+esc(p.by):''}${p.kat?' · '+esc(p.kat):''}${p.st?' · '+esc(p.st):''}${p.up?' · in OneDrive':''}${(p.an||[]).length?' · markiert':''}${p.pin?' · auf Plan':''}</div>
 ${sr.length>1?`<div class="mu">Verlauf (${sr.length} Fotos) – antippen zum Wechseln</div><div class="row" style="overflow-x:auto;flex-wrap:nowrap">${sr.map(q=>`<div class="sq" data-id="${q.id}" style="flex:0 0 84px;cursor:pointer;text-align:center"><img data-th="${q.id}" alt="" style="width:84px;height:84px;object-fit:cover;border-radius:4px;margin:0;${q===p?'outline:3px solid var(--ac)':''}"><div style="font-size:11px">${new Date(q.t).toLocaleDateString('de-AT')}</div></div>`).join('')}</div>`:''}
 <textarea id="nt" rows="3" style="height:5.6em;overflow-y:auto;resize:vertical;line-height:1.4" placeholder="Notiz zum Foto (kommt ins PDF, wird mit OneDrive abgeglichen)">${esc(p.note||'')}</textarea>
 <div class="row" style="flex-wrap:wrap;gap:6px"><button class="s cp" id="mic">🎤 Diktieren</button>
 <select class="cp" id="kt" aria-label="Kategorie" style="flex:1;min-width:130px"><option value="">Keine Kategorie</option>${KAT.map(k=>`<option>${esc(k)}</option>`).join('')}</select>
 <select class="cp" id="st" aria-label="Status" style="flex:1;min-width:130px"></select></div>
 <div class="row" style="flex-wrap:wrap;gap:6px"><button class="cp" id="ed">✎ Markieren</button><label class="btn s cp">＋ Folgefoto<input type="file" id="fu" accept="image/*" capture="environment" hidden></label>${!p.up?'<button class="s cp" id="zu" title="Zu früherem Foto zuordnen">⟲ Zuordnen</button>':''}${pl.length?'<button class="s cp" id="pn">📍 Plan</button>':''}<button class="s cp" id="mv">Verschieben</button></div>
 <div class="row" style="gap:6px"><button class="cp" id="ns">Speichern</button><button class="s cp" id="nc">Schließen</button><button class="d cp" id="nd" style="background:#fff">Löschen</button></div>`);
 const fillSt=()=>{const l=stList($('#kt').value),cur=p.st||'';$('#st').innerHTML='<option value="">Kein Status</option>'+l.concat(cur&&!l.includes(cur)?[cur]:[]).map(x=>`<option>${esc(x)}</option>`).join('');$('#st').value=cur;$('#st').style.display=l.length||cur?'':'none'};
 $('#kt').value=p.kat||'';fillSt();
 $('#kt').onchange=async e=>{p.kat=e.target.value;if(p.st&&!stList(p.kat).includes(p.st))p.st='';await put(p);fillSt();view(true)};
 $('#st').onchange=async e=>{p.st=e.target.value;await put(p);view(true)};
 $('#mic').onclick=()=>dictate($('#mic'),$('#nt'));
 document.querySelectorAll('.sq').forEach(e=>e.onclick=()=>photoView(items.find(x=>x.id===e.dataset.id)));
 $('#ed').onclick=()=>editView(p);
 if($('#zu'))$('#zu').onclick=()=>pickView(p);
 if($('#pn'))$('#pn').onclick=()=>pinView([p]);
 $('#mv').onclick=()=>moveView([p]);
 $('#fu').onchange=async e=>{const fs=[...e.target.files];e.target.value='';const n=await addFiles(fs,p.path,rootOf(p));view();if(n)photoView(n)};
 $('#nc').onclick=hideOv;
 $('#ns').onclick=async()=>{p.note=$('#nt').value.trim();await put(p);hideOv();view()};
 $('#nd').onclick=async()=>{const c=p.up&&!!tok();
  if(!confirm(c?'Foto löschen? Es wird auch in OneDrive gelöscht – für alle Personen.':'Foto auf diesem Gerät löschen?'))return;
  try{await removePhoto(p,c?await getRoot():null)}catch(e){alert(e.message+' – nicht gelöscht.');return}
  view()};
}

(async()=>{
 try{db=await openDb();items=(await tx('readonly',s=>s.getAll()))||[]}
 catch(e){db=null;alert('Speicher nicht verfügbar – Daten gehen beim Schließen verloren.')}
 const q=new URLSearchParams(location.search);
 try{if(q.get('code')){await tokenReq({grant_type:'authorization_code',code:q.get('code'),code_verifier:ls('ver')});history.replaceState({},'',location.pathname)}
  else if(q.get('error')){alert('Anmeldung abgebrochen: '+(q.get('error_description')||q.get('error')));history.replaceState({},'',location.pathname)}}
 catch(e){alert(e.message)}
 view();
 mkThumbs();
})();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(_){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
